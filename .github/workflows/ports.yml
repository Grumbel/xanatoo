name: portable builds

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.74'
      - name: Build offline web edition
        run: |
          emcmake cmake -S . -B build/wasm -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/wasm --parallel 2
          cmake --install build/wasm --prefix dist/web
      - uses: actions/upload-artifact@v4
        with:
          name: xanatoo-wasm
          path: dist/web/

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: MINGW64
            prefix: mingw-w64-x86_64
            bindir: /mingw64/bin
            arch: win64
          - msystem: MINGW32
            prefix: mingw-w64-i686
            bindir: /mingw32/bin
            arch: win32
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.prefix }}-gcc
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-ninja
            ${{ matrix.prefix }}-SDL2
            ${{ matrix.prefix }}-freetype
            python
      - name: Build and collect runtime DLLs
        shell: msys2 {0}
        run: |
          cmake -S . -B build/windows -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/windows --parallel 2
          ctest --test-dir build/windows --output-on-failure
          cmake --install build/windows --prefix dist/windows
          python mk/windows/collect_dlls.py dist/windows/bin/xanatoo.exe '${{ matrix.bindir }}'
          cp LICENSES/GPL-3.0-or-later.txt dist/windows/COPYING.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xanatoo-${{ matrix.arch }}
          path: dist/windows/
