<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
  <!-- page with centered text column (measure) -->
  <rect x="2.5" y="2.5" width="15" height="15" rx="1.5" fill="#E8EEF8" stroke="#2e3436" stroke-width="1.2"/>
  <!-- side margins -->
  <line x1="5.5" y1="2.5" x2="5.5" y2="17.5" stroke="#4A90D9" stroke-width="1" stroke-dasharray="1.5 1.5"/>
  <line x1="14.5" y1="2.5" x2="14.5" y2="17.5" stroke="#4A90D9" stroke-width="1" stroke-dasharray="1.5 1.5"/>
  <!-- text lines in the measure -->
  <line x1="7" y1="6" x2="13" y2="6" stroke="#2e3436" stroke-width="1.2"/>
  <line x1="7" y1="9" x2="13" y2="9" stroke="#2e3436" stroke-width="1.2"/>
  <line x1="7" y1="12" x2="11.5" y2="12" stroke="#2e3436" stroke-width="1.2"/>
  <line x1="7" y1="15" x2="12" y2="15" stroke="#2e3436" stroke-width="1.2"/>
</svg>
