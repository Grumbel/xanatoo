          stroke="url(#blue)" stroke-width="34" stroke-linecap="round"/>
    <circle cx="66" cy="66" r="24" fill="url(#slate)"/>
    <circle cx="190" cy="190" r="24" fill="url(#slate)"/>
    <circle cx="66" cy="190" r="24" fill="url(#blue)"/>
    <circle cx="190" cy="66" r="24" fill="url(#blue)"/>
    <path d="M66 61 C 126 61, 124 178, 181 185" fill="none"
          stroke="#FFFFFF" stroke-opacity=".24" stroke-width="4" stroke-linecap="round"/>
    <path d="M70 184 C 128 181, 128 72, 183 68" fill="none"
          stroke="#FFFFFF" stroke-opacity=".28" stroke-width="4" stroke-linecap="round"/>
