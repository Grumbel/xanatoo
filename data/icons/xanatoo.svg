<!-- App icon source; tools/make_icons.py rasterizes the hicolor and Android launcher icons from it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7CB3A"/><stop offset="1" stop-color="#E3AA10"/></linearGradient></defs>
  <rect x="12" y="12" width="232" height="232" rx="48" fill="url(#bg)"/>
  <!-- two link curves crossing: an X of connections -->
  <path d="M66 66 C 132 66, 124 190, 190 190" fill="none" stroke="#2E3436" stroke-width="34" stroke-linecap="round"/>
  <path d="M66 190 C 132 190, 124 66, 190 66" fill="none" stroke="#EDBB22" stroke-width="58" stroke-linecap="round"/>
  <path d="M66 190 C 132 190, 124 66, 190 66" fill="none" stroke="#2A62A8" stroke-width="34" stroke-linecap="round"/>
  <circle cx="66" cy="66" r="24" fill="#2E3436"/><circle cx="190" cy="190" r="24" fill="#2E3436"/>
  <circle cx="66" cy="190" r="24" fill="#2A62A8"/><circle cx="190" cy="66" r="24" fill="#2A62A8"/>
</svg>
